name: CI & Tests

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Checkout upstream Material Color Utilities for TypeScript parity
      uses: actions/checkout@v6
      with:
        repository: material-foundation/material-color-utilities
        path: material-color-utilities

    - name: Install dependencies & build extension
      run: |
        python -m pip install --upgrade pip setuptools wheel pybind11 pytest pytest-cov
        python -m pip install -r requirements.txt -r requirements-dev.txt || true
        python setup.py build_ext --inplace

    - name: Run test suite with Deno parity checks
      env:
        MCU_TYPESCRIPT_DIR: ${{ github.workspace }}/material-color-utilities/typescript
      run: |
        pytest -v
