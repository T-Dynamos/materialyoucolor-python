name: Build and Test Wheels

on:
  pull_request:
  push:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel
    
    - name: Build wheels
      run: python -m cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD_VERBOSITY: 1
        CIBW_SKIP: "cp38-*"
        CIBW_ARCHS_MACOS: "x86_64 arm64"
        CIBW_BEFORE_TEST: >
          pip install -r {project}/requirements.txt -r {project}/requirements-dev.txt
        CIBW_TEST_COMMAND: >
          python -c "from PIL import Image; Image.new('RGB', (128, 128), (70, 120, 180)).save('test_image.jpg')" &&
          python {project}/tests/test_all.py --image test_image.jpg --quality 1 --method pillow --tonal-spot &&
          python {project}/tests/test_all.py --image test_image.jpg --quality 1 --method cpp --tonal-spot &&
          pytest {project}/tests -k "not test_deno_typescript_parity"
        CIBW_BEFORE_BUILD: >
          pip install setuptools wheel pybind11

    - uses: actions/upload-artifact@v6
      with:
        name: cibuildwheel-wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Build sdist
      run: |
        python -m pip install --upgrade build
        python -m build --sdist

    - uses: actions/upload-artifact@v6
      with:
        name: cibuildwheel-sdist
        path: dist/*.tar.gz

  deploy:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v6

    - name: Download all wheels and sdist
      uses: actions/download-artifact@v7
      with:
        pattern: cibuildwheel-*
        merge-multiple: true
        path: dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages_dir: dist
